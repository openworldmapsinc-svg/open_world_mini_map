<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Apple Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Trusted Apple Map Script Framework -->
  <script src="https://apple-mapkit.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0f12; font-family: monospace; }
    
    /* Apple Map Background Sheet */
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Overlaid RPG Shroud of War Layer */
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(12, 15, 18, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  <div id="status"><div id="msg">GPS LINK READY. GENERATING TRUE EARTH LAYER...</div></div>

  <script>
    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    
    let map = null;
    let history = []; 
    let currentPos = null;
    let mapAnchorPos = null;
    let playerDot = null;

    // Boundary threshold representing exactly a 1-mile box margin limit
    const boundaryDelta = 0.0145; 

    function initAppleMap(lat, lng) {
      // Initialize an anonymous tokenless Apple Map profile
      mapkit.init({ authorizationCallback: function(done) { done(""); } });

      // Build native map view sheet
      map = new mapkit.Map("map", {
        center: new mapkit.Coordinate(lat, lng),
        zoomRange: new mapkit.ZoomRange(14, 14), // Force fixed 1-mile regional view scale
        showsMapTypeControl: false,
        showsZoomControls: false,
        showsUserLocation: false,
        isScrollEnabled: false, // Freeze background scrolling
        isZoomEnabled: false    // Lock zoom scaling
      });

      // Set map display theme to standard dark street mode vector graphics
      map.colorScheme = mapkit.ColorScheme.Dark;

      mapAnchorPos = { lat: lat, lng: lng };
      
      // Render custom neon green player tracker circle node
      playerDot = new mapkit.CircleOverlay(new mapkit.Coordinate(lat, lng), 15, {
        style: new mapkit.Style({ fillColor: "#00ffcc", strokeColor: "#00ffcc", lineWidth: 4 })
      });
      map.addOverlay(playerDot);

      // Track re-projection elements cleanly across frame adjustments
      map.addEventListener("region-change-end", drawFog);
      resizeCanvas();
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawFog() {
      if (!map || !ctx || !currentPos) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#14171d"; // Solid charcoal volumetric fog mask
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(pt => {
        // Core Conversion: Translate real geographical GPS paths into current canvas pixels
        const coord = new mapkit.Coordinate(pt.lat, pt.lng);
        const point = map.convertCoordinateToPointOnPage(coord);
        
        const rad = 90; // Trail clearing radius width
        const grad = ctx.createRadialGradient(point.x, point.y, rad * 0.1, point.x, point.y, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(point.x, point.y, rad, 0, Math.PI * 2); ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      currentPos = { lat: lat, lng: lng };

      // Initialize map sector asset on initial load
      if (!map) {
        initAppleMap(lat, lng);
      }

      // Check distance to active 1-mile margins. Shifts map configuration instantly if breached
      const latDiff = Math.abs(lat - mapAnchorPos.lat);
      const lngDiff = Math.abs(lng - mapAnchorPos.lng);

      if (latDiff > boundaryDelta || lngDiff > boundaryDelta) {
        mapAnchorPos = { lat: lat, lng: lng };
        map.setCenterAnimated(new mapkit.Coordinate(lat, lng));
      }

      // Smoothly slide the tracker dot on screen to match your footsteps
      if (playerDot) {
        playerDot.coordinate = new mapkit.Coordinate(lat, lng);
      }

      // Permanently write explored coordinate data node to trail history stack
      history.push({ lat: lat, lng: lng });
      drawFog();

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}<br>1-MILE CHUNK BOUNDARY STABLE`;
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS SIGNAL FAULT: ${err.message}`;
      }, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
