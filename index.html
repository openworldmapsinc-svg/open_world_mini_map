<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Leaflet Map CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #map { width: 100%; height: 100%; position: absolute; z-index: 1; }
    #fogCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none; mix-blend-mode: multiply; opacity: 0.92;
    }
    #status {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-family: monospace; font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  <div id="status">Waiting for GPS...</div>

  <script>
    // 1. Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([34.8526, -82.3940], 16); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const playerMarker = L.circleMarker([0,0], { radius: 8, color: '#00ffcc', fillColor: '#00ffcc', fillOpacity: 1 }).addTo(map);

    // 2. Setup Fog Canvas
    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    let history = []; // Stores revealed points: {lat, lng, radius}

    // Configured Points of Interest (POIs)
    const poiList = [
      { name: "Legacy Park", lat: 34.8306240794758, lng:-82.33148527766677, radius: 300, visited: false }
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawFog() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw base fog texture (Smoky/cloudy charcoal color)
      ctx.fillStyle = "#22252a"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Set blending mode to cut holes out of the fog
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(point => {
        const screenPos = map.latLngToContainerPoint([point.lat, point.lng]);
        
        // Soft gradient brush to make it look organic, not hard-edged
        const gradient = ctx.createRadialGradient(screenPos.x, screenPos.y, point.radius * 0.2, screenPos.x, screenPos.y, point.radius);
        gradient.addColorStop(0, 'rgba(0,0,0,1)');
        gradient.addColorStop(0.6, 'rgba(0,0,0,0.8)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(screenPos.x, screenPos.y, point.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Reset blending back to normal
      ctx.globalCompositeOperation = 'source-over';
    }

    // Redraw fog elements seamlessly when user drags or zooms map
    map.on('move', drawFog);
    map.on('zoomend', drawFog);

    // 3. GPS Tracking Logic
    function updateLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const playerLatLng = new L.LatLng(lat, lng);

      playerMarker.setLatLng(playerLatLng);
      map.panTo(playerLatLng);

      // Add regular path reveal (small radius)
      history.push({ lat: lat, lng: lng, radius: 60 });

      // Check if player entered a POI zone
      poiList.forEach(poi => {
        if (!poi.visited) {
          const distance = map.distance(playerLatLng, [poi.lat, poi.lng]);
          if (distance < 150) { // inside 150 meters
            poi.visited = true;
            // Unfog a massive area (large radius)
            history.push({ lat: poi.lat, lng: poi.lng, radius: 400 });
            document.getElementById('status').innerText = `Discovered: ${poi.name}!`;
            setTimeout(() => { document.getElementById('status').innerText = "Exploring..."; }, 4000);
          }
        }
      });

      drawFog();
      if(document.getElementById('status').innerText.indexOf("Discovered") === -1) {
        document.getElementById('status').innerText = `Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateLocation, (err) => {
        document.getElementById('status').innerText = "GPS Error. Turn on location.";
      }, { enableHighAccuracy: true, maximumAge: 0 });
    } else {
      document.getElementById('status').innerText = "GPS not supported.";
    }

    resizeCanvas();
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
</body>
</html>
