<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Iframe Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
    
    /* Layer 1: Background Iframe Window holding the live OpenStreetMap view */
    #mapWrapper {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 900px; height: 900px; z-index: 1; display: none;
    }
    #realMapFrame { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* Layer 2: Transparent canvas fog screen sitting on top of the map */
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    
    /* Layer 3: Neon Green Player Character Indicator Node */
    #playerNode {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; background: #00ffcc; border-radius: 50%;
      z-index: 3; box-shadow: 0 0 15px #00ffcc; pointer-events: none; display: none;
    }

    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 4; background: rgba(12, 15, 18, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="mapWrapper"><iframe id="realMapFrame" src=""></iframe></div>
  <canvas id="fogCanvas"></canvas>
  <div id="playerNode"></div>
  
  <div id="status"><div id="msg">GPS ACTIVE. BOOTING MAP CHANNELS...</div></div>

  <script>
    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    const mapWrapper = document.getElementById('mapWrapper');
    const realMapFrame = document.getElementById('realMapFrame');
    const playerNode = document.getElementById('playerNode');
    
    let history = []; 
    let currentPos = null; 
    let mapAnchorPos = null; 

    // Geographic boundary matching roughly a 1-mile box margin limit
    const boundaryDelta = 0.0145; 
    
    // Zoom conversion mapping factors for the OpenStreetMap window coordinate math
    const metersPerPixel = 1.35;
    const pixelsPerDegreeLng = 111320 / metersPerPixel;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderFog();
    }
    window.addEventListener('resize', resize);

    function fetchMapChunk(lat, lng) {
      document.getElementById('msg').innerHTML = "SHIFTING SECTOR...<br>RENDERING MAP CHUNK";

      // Calculate a bounding box for the embed window matching a 1-mile display space
      const offset = 0.012;
      const left = lng - offset;
      const bottom = lat - offset;
      const right = lng + offset;
      const top = lat + offset;

      // Force-inject map target via iframe parameters (Bypasses all cross-origin security rules)
      realMapFrame.src = `https://openstreetmap.org{left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik`;
      
      // Give the layout frame half a second to initialize securely
      setTimeout(() => {
        mapAnchorPos = { lat: lat, lng: lng };
        mapWrapper.style.display = "block";
        playerNode.style.display = "block";
        renderFog();
      }, 600);
    }

    function renderFog() {
      if (!currentPos || !mapAnchorPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const cosLat = Math.cos(mapAnchorPos.lat * Math.PI / 180);
      const pixelsPerDegreeLat = 111000 / metersPerPixel;

      // Calculate how far you have physically walked away from the fixed map's center coordinates
      const deltaLng = currentPos.lng - mapAnchorPos.lng;
      const deltaLat = currentPos.lat - mapAnchorPos.lat;

      // Slide the background iframe layer smoothly behind the screen view elements
      const shiftX = -(deltaLng * pixelsPerDegreeLng * cosLat);
      const shiftY = (deltaLat * pixelsPerDegreeLat);
      mapWrapper.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;

      // 2. Draw Solid Fog Layer Mask Screen
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#11141b"; // Dense volumetric color
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. Cut trail circle paths out of the canvas fog matching your physical location logs
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(pt => {
        const dLng = pt.lng - currentPos.lng;
        const dLat = pt.lat - currentPos.lat;

        const scrX = centerX + (dLng * pixelsPerDegreeLng * cosLat);
        const scrY = centerY - (dLat * pixelsPerDegreeLat);
        
        const rad = 95; // Radius of revealed terrain path hole
        const grad = ctx.createRadialGradient(scrX, scrY, rad * 0.1, scrX, scrY, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(scrX, scrY, rad, 0, Math.PI * 2); ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      currentPos = { lat: lat, lng: lng };

      // Initialize anchor map viewport location configuration on app startup
      if (!mapAnchorPos) {
        fetchMapChunk(lat, lng);
      } else {
        // Evaluate sector boundaries. If you walk past 1 mile, it re-shifts coordinates instantly
        const latDiff = Math.abs(lat - mapAnchorPos.lat);
        const lngDiff = Math.abs(lng - mapAnchorPos.lng);

        if (latDiff > boundaryDelta || lngDiff > boundaryDelta) {
          fetchMapChunk(lat, lng);
        }
      }

      // Lock exploration visibility node point to coordinate history stack
      history.push({ lat: lat, lng: lng });
      renderFog();

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}<br>GRID MATRIX TRACKING...`;
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS HARDWARE FAIL: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
