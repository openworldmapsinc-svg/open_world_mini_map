<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Real World Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0f12; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 2; background: rgba(12, 15, 18, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div id="status"><div id="msg">GPS ACTIVE. FETCHING REAL EARTH DATA...</div></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let history = []; 
    let currentPos = null;
    let mapImage = null;
    let isImageLoading = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    function render() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Draw solid backdrop
      ctx.fillStyle = "#0c0f12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Render the actual neighborhood image if it exists
      if (mapImage && mapImage.complete) {
        // Center the downloaded local real-world image directly behind the green dot
        ctx.drawImage(mapImage, centerX - (mapImage.width / 2), centerY - (mapImage.height / 2));
      }

      // 3. Create and layer the Volumetric Fog Mask
      const fogCanvas = document.createElement('canvas');
      fogCanvas.width = canvas.width;
      fogCanvas.height = canvas.height;
      const fCtx = fogCanvas.getContext('2d');

      fCtx.fillStyle = "#16191f"; // Color of the fog
      fCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Erase holes in the fog layer based on your location history
      fCtx.globalCompositeOperation = 'destination-out';
      
      // Always un-fog your immediate center zone first
      if (currentPos) {
        history.push({ x: centerX, y: centerY, rad: 90 });
      }

      history.forEach(pt => {
        const grad = fCtx.createRadialGradient(pt.x, pt.y, pt.rad * 0.1, pt.x, pt.y, pt.rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        fCtx.fillStyle = grad;
        fCtx.beginPath(); fCtx.arc(pt.x, pt.y, pt.rad, 0, Math.PI * 2); fCtx.fill();
      });

      // Overlay the computed fog down onto the street map
      ctx.drawImage(fogCanvas, 0, 0);

      // 4. Render Neon Tracker Dot
      ctx.fillStyle = "#00ffcc";
      ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
      ctx.beginPath(); ctx.arc(centerX, centerY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; 
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      currentPos = { lat: lat, lng: lng };

      // Fetch a real image map of your exact location using a lightweight provider
      if (!mapImage && !isImageLoading) {
        isImageLoading = true;
        
        const img = new Image();
        // Generates a clean 600x600 real road map image matching your exact GPS numbers
        img.src = `https://geoapify.com{lng},${lat}&zoom=15&apiKey=free`;
        
        img.onload = () => {
          mapImage = img;
          render();
        };
        img.onerror = () => {
          // If the network completely rejects the server, draw a fallback wireframe radar grid
          document.getElementById('msg').innerHTML = "DATA RESTRICTED.<br>Running Radar Wireframes.";
        };
      }

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
      render();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS SIGNAL ERROR: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
