<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- FIX: Switched to highly stable cdnjs with security parameters -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <script src="https://cloudflare.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #map { width: 100%; height: 100%; position: absolute; z-index: 1; background: #111; }
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0.9; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-family: sans-serif; font-size: 14px; text-align: center; width: 80%; max-width: 300px;
    }
    #startBtn {
      background: #ff4757; color: white; border: none; padding: 8px 15px; 
      margin-top: 8px; border-radius: 5px; font-weight: bold; width: 100%; display: block;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  
  <div id="status">
    <div>Initialising App Systems...</div>
  </div>

  <script>
    // System Logger to catch silent failures
    window.onerror = function(msg, url, line) {
      document.getElementById('status').innerHTML = `<span style="color:red">Error: ${msg} on line ${line}</span>`;
      return false;
    };

    let map, playerMarker, canvas, ctx;
    let history = [];

    // Verify network files are safe before building
    window.addEventListener('load', () => {
      if (typeof L === 'undefined') {
        document.getElementById('status').innerHTML = '<span style="color:red">Error: Map library blocked by network. Try connecting to cellular data instead of Wi-Fi.</span>';
        return;
      }
      initApp();
    });

    function initApp() {
      document.getElementById('status').innerHTML = "<div>Building World Map...</div>";
      
      // 1. Initialize Map Base Safely
      map = L.map('map', { zoomControl: false }).setView([34.8526, -82.3940], 14); 
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      playerMarker = L.circleMarker([34.8526, -82.3940], { radius: 9, color: '#00ffcc', fillColor: '#00ffcc', fillOpacity: 1 }).addTo(map);

      // 2. Setup Fog Canvas
      canvas = document.getElementById('fogCanvas');
      ctx = canvas.getContext('2d');

      window.addEventListener('resize', resizeCanvas);
      
      map.on('move', drawFog);
      map.on('zoomend', drawFog);

      resizeCanvas();
      
      // Trigger GPS request now that map is stable
      document.getElementById('status').innerHTML = `
        <div>Systems Ready.</div>
        <button id="startBtn" onclick="requestGPS()">START GPS TRACKING</button>
      `;
      
      // Auto-attempt connection
      requestGPS();
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }

    function drawFog() {
      if (!ctx || !map) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#22252a"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(point => {
        try {
          const screenPos = map.latLngToContainerPoint([point.lat, point.lng]);
          const gradient = ctx.createRadialGradient(screenPos.x, screenPos.y, point.radius * 0.1, screenPos.x, screenPos.y, point.radius);
          gradient.addColorStop(0, 'rgba(0,0,0,1)');
          gradient.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(screenPos.x, screenPos.y, point.radius, 0, Math.PI * 2);
          ctx.fill();
        } catch(e) {}
      });
      ctx.globalCompositeOperation = 'source-over';
    }

    // 3. Location Capture Core
    function updateLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      if (playerMarker && map) {
        playerMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], map.getZoom());
      }
      
      history.push({ lat: lat, lng: lng, radius: 80 });
      drawFog();

      document.getElementById('status').innerHTML = `<div>Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}</div>`;
    }

    function handleGPSError(err) {
      document.getElementById('status').innerHTML = `<div>GPS Fail: ${err.message} (Code ${err.code})</div><button id="startBtn" onclick="requestGPS()">Retry Connection</button>`;
    }

    function requestGPS() {
      document.getElementById('status').innerHTML = "Connecting to Satellites...";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(updateLocation, handleGPSError, {
          enableHighAccuracy: false,
          timeout: 15000
        });
        
        navigator.geolocation.watchPosition(updateLocation, handleGPSError, {
          enableHighAccuracy: false,
          maximumAge: 5000
        });
      } else {
        document.getElementById('status').innerText = "Device lacks GPS hardware.";
      }
    }
  </script>
</body>
</html>
