<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Infinite Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080a0f; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 2; background: rgba(10, 15, 26, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div id="status"><div id="msg">GPS ACTIVE. SYNCHRONIZING GRID...</div></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let history = []; 
    let currentPos = null;
    const scaleFactor = 280000; // Map magnification scale

    // Custom POI: Sets up a beacon zone near your position
    let poiSet = false;
    let poi = { name: "SECTOR OUTPOST", lat: 0, lng: 0, rad: 130, visited: false };

    // High-performance procedural generator mapping your layout coordinates
    function drawMapTerrain(cX, cY, lat, lng) {
      // 1. Draw Sector Grid Lines
      ctx.strokeStyle = "rgba(0, 255, 204, 0.04)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 2. Generate Real-time Infinite Local Highways
      ctx.strokeStyle = "rgba(0, 180, 255, 0.22)"; // Major expressways
      ctx.lineWidth = 4;
      
      // Draw intersecting cross-highways that lock accurately to your coordinate system
      let hX = cX - ((lng * scaleFactor) % 400);
      ctx.beginPath(); ctx.moveTo(hX, 0); ctx.lineTo(hX, canvas.height); ctx.stroke();
      
      let hY = cY + ((lat * scaleFactor) % 400);
      ctx.beginPath(); ctx.moveTo(0, hY); ctx.lineTo(canvas.width, hY); ctx.stroke();

      // 3. Generate Minor Residential Streets
      ctx.strokeStyle = "rgba(0, 255, 204, 0.15)"; 
      ctx.lineWidth = 2;
      for (let i = -5; i <= 5; i++) {
        let roadX = cX + (i * 120) - ((lng * scaleFactor) % 120);
        ctx.beginPath(); ctx.moveTo(roadX, 0); ctx.lineTo(roadX, canvas.height); ctx.stroke();
        
        let roadY = cY + (i * 120) + ((lat * scaleFactor) % 120);
        ctx.beginPath(); ctx.moveTo(0, roadY); ctx.lineTo(canvas.width, roadY); ctx.stroke();
      }

      // 4. Render Target POI Outpost Beacon if active
      if (poiSet) {
        const poiX = cX + (poi.lng - lng) * scaleFactor;
        const poiY = cY - (poi.lat - lat) * scaleFactor;
        
        ctx.fillStyle = poi.visited ? "rgba(0, 255, 100, 0.12)" : "rgba(255, 60, 60, 0.08)";
        ctx.beginPath(); ctx.arc(poiX, poiY, poi.rad, 0, Math.PI * 2); ctx.fill();
        
        ctx.strokeStyle = poi.visited ? "#00ff64" : "#ff3e3e";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    function render() {
      if (!currentPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Render Underlying Vector Terrain
      drawMapTerrain(centerX, centerY, currentPos.lat, currentPos.lng);

      // 2. Compute and Overlay the Volumetric Shroud
      const fogCanvas = document.createElement('canvas');
      fogCanvas.width = canvas.width;
      fogCanvas.height = canvas.height;
      const fCtx = fogCanvas.getContext('2d');

      // Heavy charcoal shadow fog profile
      fCtx.fillStyle = "#11141a";
      fCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Erase fog patterns around historical exploration pathways
      fCtx.globalCompositeOperation = 'destination-out';
      history.forEach(pt => {
        const scrX = centerX + (pt.lng - currentPos.lng) * scaleFactor;
        const scrY = centerY - (pt.lat - currentPos.lat) * scaleFactor;
        
        const rad = pt.customRad || 85; // Standard reveal radius or POI blast radius
        const grad = fCtx.createRadialGradient(scrX, scrY, rad * 0.1, scrX, scrY, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        fCtx.fillStyle = grad;
        fCtx.beginPath(); fCtx.arc(scrX, scrY, rad, 0, Math.PI * 2); fCtx.fill();
      });

      // Overlay completed visibility state onto view grid
      ctx.drawImage(fogCanvas, 0, 0);

      // 3. Draw Neon Player Node
      ctx.fillStyle = "#00ffcc";
      ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
      ctx.beginPath(); ctx.arc(centerX, centerY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; 
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      currentPos = { lat: lat, lng: lng };

      // Initialize a POI outpost slightly ahead of your starting spot on first load
      if (!poiSet) {
        poi.lat = lat + 0.0015;
        poi.lng = lng + 0.0015;
        poiSet = true;
      }

      // Record tracking trail path point
      history.push({ lat: lat, lng: lng });

      // Check distance to configured outpost
      const dLat = lat - poi.lat;
      const dLng = lng - poi.lng;
      const dist = Math.sqrt(dLat * dLat + dLng * dLng) * scaleFactor;
      
      if (dist < poi.rad && !poi.visited) {
        poi.visited = true;
        // Unfog massive area instantly (Blast radius: 450 pixels)
        history.push({ lat: poi.lat, lng: poi.lng, customRad: 450 });
      }

      if (poi.visited) {
        document.getElementById('msg').innerHTML = `OUTPOST DISCOVERED!<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
      } else {
        document.getElementById('msg').innerHTML = `GPS DATA ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}<br>TARGET: 300m North-East`;
      }
      
      render();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `SATELLITE SYNC LOST: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
