<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Leaflet Map CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #map { width: 100%; height: 100%; position: absolute; z-index: 1; }
    #fogCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none; mix-blend-mode: multiply; opacity: 0.92;
    }
    #status {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-family: monospace; font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  <div id="status">Waiting for GPS...</div>

  <script>
    // 1. Initialize Map with valid starting coordinates (Greenville, SC placeholder)
    const map = L.map('map', { zoomControl: false }).setView([34.8526, -82.3940], 16); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // FIX: Corrected syntax with valid starting coordinates
    const playerMarker = L.circleMarker([34.8526, -82.3940], { 
      radius: 8, 
      color: '#00ffcc', 
      fillColor: '#00ffcc', 
      fillOpacity: 1 
    }).addTo(map);

    // 2. Setup Fog Canvas
    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    let history = []; 

    // Configured Points of Interest (POIs)
    const poiList = [
      { name: "Big City Center", lat: 34.8526, lng: -82.3940, radius: 300, visited: false }
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawFog() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Base fog texture
      ctx.fillStyle = "#22252a"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Blending mode to clear fog holes
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(point => {
        try {
          const screenPos = map.latLngToContainerPoint([point.lat, point.lng]);
          
          const gradient = ctx.createRadialGradient(
            screenPos.x, screenPos.y, point.radius * 0.1, 
            screenPos.x, screenPos.y, point.radius
          );
          gradient.addColorStop(0, 'rgba(0,0,0,1)');
          gradient.addColorStop(0.6, 'rgba(0,0,0,0.8)');
          gradient.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(screenPos.x, screenPos.y, point.radius, 0, Math.PI * 2);
          ctx.fill();
        } catch(e) { /* Map projection not ready yet */ }
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    map.on('move', drawFog);
    map.on('zoomend', drawFog);

    // 3. GPS Tracking Logic
    function updateLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const playerLatLng = new L.LatLng(lat, lng);

      playerMarker.setLatLng(playerLatLng);
      map.setView(playerLatLng, map.getZoom()); // Smoothly center map

      // Add regular path reveal radius
      history.push({ lat: lat, lng: lng, radius: 80 });

      // Check POIs
      poiList.forEach(poi => {
        if (!poi.visited) {
          const distance = map.distance(playerLatLng, [poi.lat, poi.lng]);
          if (distance < 150) { 
            poi.visited = true;
            history.push({ lat: poi.lat, lng: poi.lng, radius: 400 });
            document.getElementById('status').innerText = `Discovered: ${poi.name}!`;
            setTimeout(() => { document.getElementById('status').innerText = "Exploring..."; }, 4000);
          }
        }
      });

      drawFog();
      if(!document.getElementById('status').innerText.includes("Discovered")) {
        document.getElementById('status').innerText = `Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateLocation, (err) => {
        document.getElementById('status').innerText = `GPS Error: ${err.message}. Check iOS Settings.`;
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    } else {
      document.getElementById('status').innerText = "GPS not supported.";
    }

    // Initialize layout sizing
    setTimeout(resizeCanvas, 500);
  </script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
