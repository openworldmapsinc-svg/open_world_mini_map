<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Primary CDN Links -->
  <link id="css-cdn" rel="stylesheet" href="https://unpkg.com" />
  <script id="js-cdn" src="https://unpkg.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #map { width: 100%; height: 100%; position: absolute; z-index: 1; background: #111; }
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0.9; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-family: sans-serif; font-size: 14px; text-align: center; width: 80%; max-width: 300px;
    }
    #startBtn {
      background: #ff4757; color: white; border: none; padding: 8px 15px; 
      margin-top: 8px; border-radius: 5px; font-weight: bold; width: 100%; display: block;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  
  <div id="status">
    <div>Connecting to Map Nodes...</div>
  </div>

  <script>
    // Global error logger
    window.onerror = function(msg, url, line) {
      document.getElementById('status').innerHTML = `<span style="color:red">Error: ${msg} on line ${line}</span>`;
      return false;
    };

    let map, playerMarker, canvas, ctx;
    let history = [];

    // AUTOMATIC NETWORK FALLBACK SYSTEM
    window.addEventListener('load', () => {
      if (typeof L === 'undefined') {
        document.getElementById('status').innerHTML = "<div>Primary map blocked. Trying Backup Node...</div>";
        
        // Backup Attempt: Force fallback URLs into the layout
        const altCSS = document.createElement('link');
        altCSS.rel = 'stylesheet';
        altCSS.href = 'https://jsdelivr.net';
        document.head.appendChild(altCSS);

        const altJS = document.createElement('script');
        altJS.src = 'https://jsdelivr.net';
        altJS.onload = () => { initApp(); };
        altJS.onerror = () => {
          document.getElementById('status').innerHTML = '<span style="color:red">All web map nodes blocked. Please turn off your phone VPN / content blocker settings.</span>';
        };
        document.head.appendChild(altJS);
      } else {
        initApp();
      }
    });

    function initApp() {
      document.getElementById('status').innerHTML = "<div>Rendering Fog Canvas...</div>";
      
      // 1. Setup Leaflet
      map = L.map('map', { zoomControl: false }).setView([34.8526, -82.3940], 14); 
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      playerMarker = L.circleMarker([34.8526, -82.3940], { radius: 9, color: '#00ffcc', fillColor: '#00ffcc', fillOpacity: 1 }).addTo(map);

      // 2. Setup Canvas
      canvas = document.getElementById('fogCanvas');
      ctx = canvas.getContext('2d');

      window.addEventListener('resize', resizeCanvas);
      map.on('move', drawFog);
      map.on('zoomend', drawFog);

      resizeCanvas();
      
      document.getElementById('status').innerHTML = `
        <div>Systems Clear!</div>
        <button id="startBtn" onclick="requestGPS()">INITIALISE GPS</button>
      `;
      
      requestGPS();
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }

    function drawFog() {
      if (!ctx || !map) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#1d2024"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(point => {
        try {
          const screenPos = map.latLngToContainerPoint([point.lat, point.lng]);
          const gradient = ctx.createRadialGradient(screenPos.x, screenPos.y, point.radius * 0.1, screenPos.x, screenPos.y, point.radius);
          gradient.addColorStop(0, 'rgba(0,0,0,1)');
          gradient.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(screenPos.x, screenPos.y, point.radius, 0, Math.PI * 2);
          ctx.fill();
        } catch(e) {}
      });
      ctx.globalCompositeOperation = 'source-over';
    }

    function updateLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      if (playerMarker && map) {
        playerMarker.setLatLng([lat, lng]);
        map.setView([lat, lng], map.getZoom());
      }
      
      history.push({ lat: lat, lng: lng, radius: 85 });
      drawFog();

      document.getElementById('status').innerHTML = `<div>Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}</div>`;
    }

    function handleGPSError(err) {
      document.getElementById('status').innerHTML = `<div>GPS Offline: ${err.message}</div><button id="startBtn" onclick="requestGPS()">Retry Satellite Sync</button>`;
    }

    function requestGPS() {
      document.getElementById('status').innerHTML = "Pinging Satellites...";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(updateLocation, handleGPSError, {
          enableHighAccuracy: false,
          timeout: 10000
        });
        navigator.geolocation.watchPosition(updateLocation, handleGPSError, {
          enableHighAccuracy: false,
          maximumAge: 4000
        });
      } else {
        document.getElementById('status').innerText = "Device lacks GPS.";
      }
    }
  </script>
</body>
</html>
