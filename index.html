<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Using Mapbox GL JS for beautiful, unblockable RPG style vectors -->
  <link href="https://mapbox.com" rel="stylesheet">
  <script src="https://mapbox.com"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d10; font-family: monospace; }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 3; background: rgba(15, 23, 42, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 10px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <canvas id="fogCanvas"></canvas>
  <div id="status"><div id="msg">GPS ACTIVE. LOCATING...</div></div>

  <script>
    // Global Error Logger
    window.onerror = function(msg, url, line) {
      document.getElementById('msg').innerHTML = `<span style="color:red">Error: ${msg}</span>`;
      return false;
    };

    // PASTE YOUR FREE MAPBOX ACCESS TOKEN HERE
    mapboxgl.accessToken = 'pk.eyJ1IjoiZGVib2prbyIsImEiOiJjbXNkano5Z2kwN2Y5MnpvbzRkd2xoaHV1In0.KJnaVuZOu2uJHhqypfyPAA';

    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    
    let map;
    let history = []; 
    let currentPos = null;
    let playerMarkerElement;
    let playerMarker;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    function initMap(lat, lng) {
      // Create a gorgeous Sci-Fi Dark Vector style map base
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11', 
        center: [lng, lat],
        zoom: 15,
        interactive: false // Lock controls so user position rules movement
      });

      // Design custom Neon neon node indicator element
      playerMarkerElement = document.createElement('div');
      playerMarkerElement.style.width = '16px';
      playerMarkerElement.style.height = '16px';
      playerMarkerElement.style.backgroundColor = '#00ffcc';
      playerMarkerElement.style.borderRadius = '50%';
      playerMarkerElement.style.boxShadow = '0 0 15px #00ffcc';

      playerMarker = new mapboxgl.Marker(playerMarkerElement)
        .setLngLat([lng, lat])
        .addTo(map);

      map.on('move', drawFog);
      resizeCanvas();
    }

    function drawFog() {
      if (!map || !ctx || !currentPos) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#16191f"; // Smooth RPG fog layer
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(pt => {
        // Map native geographical coordinates directly to current screen pixel location
        const screenPos = map.project([pt.lng, pt.lat]);
        
        // Dynamic fog circle size modifier
        const rad = 90; 
        
        const grad = ctx.createRadialGradient(screenPos.x, screenPos.y, rad * 0.1, screenPos.x, screenPos.y, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(screenPos.x, screenPos.y, rad, 0, Math.PI * 2); ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      currentPos = { lat: lat, lng: lng };

      history.push({ lat: lat, lng: lng });

      if (!map) {
        initMap(lat, lng);
      } else {
        playerMarker.setLngLat([lng, lat]);
        map.setCenter([lng, lat]);
        drawFog();
      }

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS DATA FAULT: ${err.message}`;
      }, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
