<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Vector Street Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080a0f; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 2; background: rgba(10, 15, 26, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.15); pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div id="status"><div id="msg">GPS LINK READY. OVERLAYING STREETS...</div></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let history = []; 
    let currentPos = null;
    let streetElements = []; // Stores real neighborhood roads
    let loadedBBox = null;
    
    const scaleFactor = 350000; // Visual map magnification

    // Fetch real-world street blueprints over an unblockable text API
    function loadRealStreets(lat, lng) {
      // Calculate a bounding box roughly 1.5 miles around you
      const range = 0.015;
      const minLat = lat - range;
      const minLng = lng - range;
      const maxLat = lat + range;
      const maxLng = lng + range;

      loadedBBox = { minLat, minLng, maxLat, maxLng };

      // Query raw street geometry coordinates safely from open storage
      const query = `[out:json];way["highway"](${minLat},${minLng},${maxLat},${maxLng});out geom;`;
      const url = `https://overpass-api.de{encodeURIComponent(query)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data && data.elements) {
            streetElements = data.elements;
            render();
          }
        })
        .catch(err => {
          document.getElementById('msg').innerHTML = "Map Stream Throttled. Retrying...";
        });
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    function render() {
      if (!currentPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Clear viewport background
      ctx.fillStyle = "#080a0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Render actual neighborhood layout geometry underneath fog
      ctx.lineWidth = 2.5;
      streetElements.forEach(element => {
        if (element.geometry && element.geometry.length > 1) {
          // Identify highway ranking for custom coloring
          const type = element.tags ? element.tags.highway : 'road';
          if (type === 'motorway' || type === 'trunk' || type === 'primary') {
            ctx.strokeStyle = "rgba(0, 150, 255, 0.4)"; // Main Highways (Blue neon)
            ctx.lineWidth = 4;
          } else {
            ctx.strokeStyle = "rgba(0, 255, 204, 0.22)"; // Neighborhood lines (Cyan neon)
            ctx.lineWidth = 2;
          }

          ctx.beginPath();
          element.geometry.forEach((pt, index) => {
            const scrX = centerX + (pt.lon - currentPos.lng) * scaleFactor * Math.cos(currentPos.lat * Math.PI / 180);
            const scrY = centerY - (pt.lat - currentPos.lat) * scaleFactor;
            
            if (index === 0) ctx.moveTo(scrX, scrY);
            else ctx.lineTo(scrX, scrY);
          });
          ctx.stroke();
        }
      });

      // 3. Render Volumetric Fog Layer Canvas Mask
      const fogCanvas = document.createElement('canvas');
      fogCanvas.width = canvas.width;
      fogCanvas.height = canvas.height;
      const fCtx = fogCanvas.getContext('2d');

      fCtx.fillStyle = "#13161c";
      fCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Carve out path lines from the fog canvas based on your physical location history
      fCtx.globalCompositeOperation = 'destination-out';
      history.forEach(pt => {
        const scrX = centerX + (pt.lng - currentPos.lng) * scaleFactor * Math.cos(currentPos.lat * Math.PI / 180);
        const scrY = centerY - (pt.lat - currentPos.lat) * scaleFactor;
        
        const rad = 90; // Fog clearing brush width
        const grad = fCtx.createRadialGradient(scrX, scrY, rad * 0.1, scrX, scrY, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        fCtx.fillStyle = grad;
        fCtx.beginPath(); fCtx.arc(scrX, scrY, rad, 0, Math.PI * 2); fCtx.fill();
      });

      // Layer the computed fog directly down over our neighborhood lines
      ctx.drawImage(fogCanvas, 0, 0);

      // 4. Render Neon Node tracking indicator
      ctx.fillStyle = "#00ffcc";
      ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
      ctx.beginPath(); ctx.arc(centerX, centerY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; 
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      currentPos = { lat: lat, lng: lng };
      
      // Plot movement path coordinates
      history.push({ lat: lat, lng: lng });

      // Trigger map update download if moving beyond active tracking boundaries
      if (!loadedBBox || lat < loadedBBox.minLat || lat > loadedBBox.maxLat || lng < loadedBBox.minLng || lng > loadedBBox.maxLng) {
        loadRealStreets(lat, lng);
      }

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
      render();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS DATA FAULT: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
