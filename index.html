<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
    
    /* Layer 1: Pinned background container holding the real map image */
    #mapWrapper {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 800px; height: 800px; z-index: 1; display: none;
    }
    #realMapImg { width: 100%; height: 100%; display: block; }

    /* Layer 2: Transparent fog screen floating directly on top of the map */
    #fogCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    
    /* Layer 3: Neon Green Player Character Indicator Node */
    #playerNode {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; background: #00ffcc; border-radius: 50%;
      z-index: 3; box-shadow: 0 0 15px #00ffcc; pointer-events: none; display: none;
    }

    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 4; background: rgba(12, 15, 18, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="mapWrapper"><img id="realMapImg" src="" alt="Real World Map"></div>
  <canvas id="fogCanvas"></canvas>
  <div id="playerNode"></div>
  
  <div id="status"><div id="msg">GPS ACTIVE. FETCHING LOCAL SECTOR MAP...</div></div>

  <script>
    const canvas = document.getElementById('fogCanvas');
    const ctx = canvas.getContext('2d');
    const mapWrapper = document.getElementById('mapWrapper');
    const realMapImg = document.getElementById('realMapImg');
    const playerNode = document.getElementById('playerNode');
    
    let history = []; 
    let currentPos = null; 
    let mapAnchorPos = null; 
    let isImageLoading = false;

    // Geographic distance indicating a 1-mile perimeter boundary safety box
    const boundaryDelta = 0.0145; 
    
    // Zoom conversion factors for the map dimension scale matching
    const metersPerPixel = 1.35;
    const pixelsPerDegreeLng = 111320 / metersPerPixel;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderFog();
    }
    window.addEventListener('resize', resize);

    // Pulls a high-contrast dark street map layout match for gaming aesthetics
    function fetchMapChunk(lat, lng) {
      if (isImageLoading) return;
      isImageLoading = true;
      document.getElementById('msg').innerHTML = "SYNCING NEW SECTOR...<br>DOWNLOADING MAP BLUEPRINT";

      // Pre-load the image safely via standard HTML pipeline instead of Canvas parsing
      realMapImg.src = `https://geoapify.com{lng},${lat}&zoom=14&apiKey=free`;
      
      realMapImg.onload = () => {
        mapAnchorPos = { lat: lat, lng: lng };
        mapWrapper.style.display = "block";
        playerNode.style.display = "block";
        isImageLoading = false;
        renderFog();
      };
    }

    function renderFog() {
      if (!currentPos || !mapAnchorPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const cosLat = Math.cos(mapAnchorPos.lat * Math.PI / 180);
      const pixelsPerDegreeLat = 111000 / metersPerPixel;

      // Calculate distance walked away from the fixed background map's center spot
      const deltaLng = currentPos.lng - mapAnchorPos.lng;
      const deltaLat = currentPos.lat - mapAnchorPos.lat;

      // Physically slide the background map layer behind the screen elements
      const shiftX = -(deltaLng * pixelsPerDegreeLng * cosLat);
      const shiftY = (deltaLat * pixelsPerDegreeLat);
      mapWrapper.style.transform = `translate(calc(-50% + ${shiftX}px), calc(-50% + ${shiftY}px))`;

      // 2. Draw the Opaque Fog Overlay screen
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#111317"; // Dark volumetric shroud color
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. Cut out historical movement paths dynamically
      ctx.globalCompositeOperation = 'destination-out';

      history.forEach(pt => {
        const dLng = pt.lng - currentPos.lng;
        const dLat = pt.lat - currentPos.lat;

        // Position the clear hole accurately over the streets you walked on
        const scrX = centerX + (dLng * pixelsPerDegreeLng * cosLat);
        const scrY = centerY - (dLat * pixelsPerDegreeLat);
        
        const rad = 95; // Radius size of revealed map area
        const grad = ctx.createRadialGradient(scrX, scrY, rad * 0.1, scrX, scrY, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(scrX, scrY, rad, 0, Math.PI * 2); ctx.fill();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      currentPos = { lat: lat, lng: lng };

      // Establish initial map quadrant chunk setup on cold start
      if (!mapAnchorPos) {
        fetchMapChunk(lat, lng);
      } else {
        // Evaluate boundary parameters. If crossed, download adjacent 1-mile map chunk
        const latDiff = Math.abs(lat - mapAnchorPos.lat);
        const lngDiff = Math.abs(lng - mapAnchorPos.lng);

        if (latDiff > boundaryDelta || lngDiff > boundaryDelta) {
          fetchMapChunk(lat, lng);
        }
      }

      // Drop visibility path node to history log stack
      history.push({ lat: lat, lng: lng });
      renderFog();

      if (!isImageLoading) {
        document.getElementById('msg').innerHTML = `SATELLITE LINK ONLINE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}<br>REVEALING MAP MATRIX...`;
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS LINK LOST: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
