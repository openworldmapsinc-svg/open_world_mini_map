<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Cyber Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080a0f; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 2; background: rgba(10, 15, 26, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 8px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.15); pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div id="status"><div id="msg">GPS ACTIVE. LOCATING...</div></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let history = []; 
    let currentPos = null;
    let startPos = null;
    
    // Scale modifier to turn small coordinate fractions into screen layouts
    const scaleFactor = 150000; 

    // Seeded Road Generator to simulate local streets dynamically based on your coordinates
    function drawProceduralStreets(cX, cY, lat, lng) {
      ctx.strokeStyle = "rgba(0, 255, 204, 0.18)";
      ctx.lineWidth = 3;
      
      // Generate unique grid offsets based on your city location numbers
      let seedX = Math.floor(lng * 100);
      let seedY = Math.floor(lat * 100);
      
      // Draw grid-based local avenues underneath the fog
      for (let i = -10; i <= 10; i++) {
        let xPos = cX + (i * 120) - ((lng * scaleFactor) % 120);
        ctx.beginPath();
        ctx.moveTo(xPos, 0);
        ctx.lineTo(xPos, canvas.height);
        ctx.stroke();
      }
      for (let j = -10; j <= 10; j++) {
        let yPos = cY + (j * 120) + ((lat * scaleFactor) % 120);
        ctx.beginPath();
        ctx.moveTo(0, yPos);
        ctx.lineTo(canvas.width, yPos);
        ctx.stroke();
      }

      // Draw stylized diagonal highways
      ctx.strokeStyle = "rgba(0, 160, 255, 0.12)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cX - 1000, cY - 1000); ctx.lineTo(cX + 1000, cY + 1000);
      ctx.moveTo(cX - 1000, cY + 1000); ctx.lineTo(cX + 1000, cY - 1000);
      ctx.stroke();
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    function render() {
      if (!currentPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Clear background
      ctx.fillStyle = "#080a0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Draw our local generated vector layout blueprint
      drawProceduralStreets(centerX, centerY, currentPos.lat, currentPos.lng);

      // 3. Render Overlaid Fog Layer using offscreen calculations
      const fogCanvas = document.createElement('canvas');
      fogCanvas.width = canvas.width;
      fogCanvas.height = canvas.height;
      const fCtx = fogCanvas.getContext('2d');

      // Heavy Sci-Fi charcoal shroud
      fCtx.fillStyle = "#13161c";
      fCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Cut out trail areas where you have walked
      fCtx.globalCompositeOperation = 'destination-out';
      history.forEach(pt => {
        // Calculate offset position on screen relative to where you stand right now
        const scrX = centerX + (pt.lng - currentPos.lng) * scaleFactor;
        const scrY = centerY - (pt.lat - currentPos.lat) * scaleFactor;
        
        const rad = 85; // Visibility trail brush radius
        const grad = fCtx.createRadialGradient(scrX, scrY, rad * 0.1, scrX, scrY, rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        fCtx.fillStyle = grad;
        fCtx.beginPath(); fCtx.arc(scrX, scrY, rad, 0, Math.PI * 2); fCtx.fill();
      });

      // Layer the computed fog overlay directly down onto our grid
      ctx.drawImage(fogCanvas, 0, 0);

      // 4. Render Neon Node tracking indicator
      ctx.fillStyle = "#00ffcc";
      ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
      ctx.beginPath(); ctx.arc(centerX, centerY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; 
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!startPos) startPos = { lat: lat, lng: lng };
      currentPos = { lat: lat, lng: lng };
      
      // Lock movement path plot point
      history.push({ lat: lat, lng: lng });

      document.getElementById('msg').innerHTML = `SATELLITE SYNC ACTIVE<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
      render();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS DATA FAULT: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
