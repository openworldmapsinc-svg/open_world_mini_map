<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Fog Map Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d10; font-family: monospace; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #status {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 2; background: rgba(15, 23, 42, 0.95); color: #00ffcc; padding: 15px;
      border-radius: 10px; border: 1px solid #00ffcc; text-align: center; width: 85%; max-width: 320px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div id="status"><div id="msg">GPS ACTIVE. LOCATING...</div></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let history = []; 
    let currentPos = null;
    let cachedTiles = {}; 
    const zoom = 16; // Standard city street map zoom level

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    // Mathematical conversions to map standard GPS to OpenStreetMap pixel grid tiles
    function lon2tile(lon, zoom) { return Math.floor((lon + 180) / 360 * Math.pow(2, zoom)); }
    function lat2tile(lat, zoom) { return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom)); }
    
    function lon2pixel(lon, zoom, tileX) {
      const n = Math.pow(2, zoom);
      const x = (lon + 180) / 360 * n;
      return (x - tileX) * 256;
    }
    function lat2pixel(lat, zoom, tileY) {
      const n = Math.pow(2, zoom);
      const latRad = lat * Math.PI / 180;
      const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
      return (y - tileY) * 256;
    }

    function render() {
      if (!currentPos) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Calculate and fetch target center tile structures
      const centerTileX = lon2tile(currentPos.lng, zoom);
      const centerTileY = lat2tile(currentPos.lat, zoom);
      
      const pX = lon2pixel(currentPos.lng, zoom, centerTileX);
      const pY = lat2pixel(currentPos.lat, zoom, centerTileY);

      // Draw active 3x3 surrounding map grid block around player
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const tX = centerTileX + dx;
          const tY = centerTileY + dy;
          const tileKey = `${zoom}_${tX}_${tY}`;

          const startX = centerX - pX + (dx * 256);
          const startY = centerY - pY + (dy * 256);

          if (cachedTiles[tileKey] && cachedTiles[tileKey].complete) {
            ctx.drawImage(cachedTiles[tileKey], startX, startY);
          } else if (!cachedTiles[tileKey]) {
            // Fetch standard map background chunk directly through native image loader
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = `https://openstreetmap.org{zoom}/${tX}/${tY}.png`;
            img.onload = () => { render(); };
            cachedTiles[tileKey] = img;
          }
        }
      }

      // 2. Render Overlaid Fog Layer
      const fogCanvas = document.createElement('canvas');
      fogCanvas.width = canvas.width;
      fogCanvas.height = canvas.height;
      const fCtx = fogCanvas.getContext('2d');

      // Volumetric charcoal fog mask color
      fCtx.fillStyle = "#1e222b";
      fCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Slice holes out of the fog relative to historical travel coordinates
      fCtx.globalCompositeOperation = 'destination-out';
      history.forEach(pt => {
        // Calculate offset position on screen relative to where you are standing now
        const scaleFactor = 1200000; // Pixel coordinate modifier
        const scrX = centerX + (pt.lng - currentPos.lng) * scaleFactor * Math.cos(currentPos.lat * Math.PI / 180);
        const scrY = centerY - (pt.lat - currentPos.lat) * scaleFactor;
        
        const grad = fCtx.createRadialGradient(scrX, scrY, pt.rad * 0.1, scrX, scrY, pt.rad);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        fCtx.fillStyle = grad;
        fCtx.beginPath(); fCtx.arc(scrX, scrY, pt.rad, 0, Math.PI * 2); fCtx.fill();
      });

      // Overlay the computed fog state on screen
      ctx.drawImage(fogCanvas, 0, 0);

      // 3. Render Neon Player Marker Node
      ctx.fillStyle = "#00ffcc";
      ctx.shadowBlur = 12; ctx.shadowColor = "#00ffcc";
      ctx.beginPath(); ctx.arc(centerX, centerY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; 
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      currentPos = { lat: lat, lng: lng };
      
      // Permanently save path reveal coordinate point (radius: 95 pixels)
      history.push({ lat: lat, lng: lng, rad: 95 });

      document.getElementById('msg').innerHTML = `GPS DATA SIGNAL SYNCED<br>LAT: ${lat.toFixed(4)}<br>LNG: ${lng.toFixed(4)}`;
      render();
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updateGPS, (err) => {
        document.getElementById('msg').innerHTML = `GPS FAULT: ${err.message}`;
      }, { enableHighAccuracy: true });
    }

    resize();
  </script>
</body>
</html>
